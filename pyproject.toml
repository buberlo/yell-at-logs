[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logguilt"
version = "0.1.0"
description = "Tail messy logs, score incident guilt, and post passive-aggressive poetry to GitHub."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Log Guilt Maintainers" }
]
keywords = [
    "logs",
    "cli",
    "severity",
    "incidents",
    "poetry",
    "github"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4"
]

[project.scripts]
logguilt = "logguilt.cli:main"

[project.urls]
Homepage = "https://example.com/logguilt"
Repository = "https://github.com/example/logguilt"
Changelog = "https://github.com/example/logguilt/blob/main/CHANGELOG.md"
Issues = "https://github.com/example/logguilt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/logguilt"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "README.md"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
filterwarnings = [
    "ignore::DeprecationWarning:logguilt.*"
]

[tool.coverage.run]
source = ["logguilt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError"
]